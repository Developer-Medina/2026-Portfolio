<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Skeleton vs Card – Exemplo Mental</title>

  <style>
    body {
      background: #0f0f12;
      color: #e5e7eb;
      font-family: system-ui, sans-serif;
      padding: 2rem;
    }

    .hidden {
      display: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1rem;
    }

    /* ===== Skeleton ===== */

    .skeleton-card {
      background: #16161a;
      border-radius: 12px;
      padding: 1rem;
      min-height: 200px;
    }

    .skeleton-line {
      height: 14px;
      background: linear-gradient(
        90deg,
        #222 25%,
        #333 37%,
        #222 63%
      );
      background-size: 400% 100%;
      animation: pulse 1.4s infinite;
      border-radius: 6px;
      margin-bottom: 0.75rem;
    }

    .skeleton-line.title {
      height: 20px;
      width: 70%;
    }

    .skeleton-line.desc {
      height: 60px;
    }

    @keyframes pulse {
      0% { background-position: 100% 0; }
      100% { background-position: 0 0; }
    }

    /* ===== Card real ===== */

    .project-card {
      background: #16161a;
      border-radius: 12px;
      padding: 1rem;
      min-height: 200px;
      display: flex;
      flex-direction: column;
    }

    .project-card h3 {
      margin: 0 0 0.5rem;
    }

    .project-card p {
      font-size: 0.9rem;
      opacity: 0.85;
      flex-grow: 1;
    }
  </style>
</head>

<body>

  <!-- Skeleton -->
  <section id="skeleton-wrapper">
    <div class="grid" id="skeleton-container"></div>
  </section>

  <!-- Cards reais -->
  <section id="cards-wrapper" class="hidden">
    <div class="grid" id="cards-container"></div>
  </section>

  <script>
    // salvamos o URL da API
    const API_URL = 'https://medina-portfolio-api-2e362865a1d8.herokuapp.com/projects';

    // headers, né?
    const HEADERS = {
      "Content-Type": "application/json",
      "PORTFOLIO-API-KEY": "medina-personal-key"
    };

    /* ===== Skeleton ===== */

    function criarSkeleton(qtd = 6) {
      const container = document.getElementById('skeleton-container'); // selecionamos container
      container.innerHTML = ''; // limpamos o container

      for (let i = 0; i < qtd; i++) {
        const card = document.createElement('div'); // criamos uma div
        card.className = 'skeleton-card'; // atribuimos a clase a ela
 
        // aqui estamos criando divs, dentro do card
        // uma com o titulo do esqueleto
        // outra linha que seria do subtitulo
        // outra com mais linha da descricao
        card.innerHTML = `
          <div class="skeleton-line title"></div>
          <div class="skeleton-line"></div>
          <div class="skeleton-line desc"></div>
        `;

        // colocamos o card no container
        container.appendChild(card);
      }
    }

    /* ===== Card real ===== */

    // essa é a função para criar cards reais, não precisamos nos preocupar com a quantidade
    function criarCard(dado) {
        // criamos o card de verdade agora
      const card = document.createElement('div');
      card.className = 'project-card';

      card.innerHTML = `
        <h3>${dado.name}</h3>
        <p>${dado.projectDescription.longDescription}</p>
        <small>${dado.category}</small>
      `;

      return card;
    }

    /* ===== Fetch ===== */
    // funcao pra fazer o fetch da API e retornar os dados
    async function fetchApi() {
      const response = await fetch(API_URL, { headers: HEADERS });
      if (!response.ok) throw new Error('API error');
      return response.json();
    }

    /* ===== Genesis ===== */

    // essa funcao que é a maior que temos
    async function init() {
      criarSkeleton(); // ← não sabe NADA da API, apenas cria 

      const data = await fetchApi();
        
      const cardsContainer = document.getElementById('cards-container');

      // para cada item dentro de data, chamamos o container, inserimos o elemento já com a chamada da funcao e o item como parametro
      data.forEach(item => {
        cardsContainer.appendChild(criarCard(item));
      });

      // troca de estado visual
      document.getElementById('skeleton-wrapper').remove(); // removemos o esqueleto por inteiro
      document.getElementById('cards-wrapper').classList.remove('hidden'); // removemos o hidden ao final do loading
    }

    init();
  </script>
</body>
</html>
