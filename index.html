<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <title>Medina - Portfolio</title>
</head>
<body>
    
    <!-- Header + menu -->

    <header class="header">
        <nav class="nav-menu">
            <div class="nav-bar">
                <!-- a barra do menu-->

                <a href="https://github.com/Developer-Medina" class="nav-logo">Medina</a>
                <span class="material-symbols-outlined menu-button" onclick="openMenu()">
                    menu
                </span>
            </div>

            <div class="nav-panel">
                <!-- criando uma classe para o pading já existir, mas nao precisarmos animar ele pra lascar com o alinhamento-->
                <div class="nav-content-padding">
                    <!-- o menu suspenso em si -->
                    <ul class="nav-list">
                        <li class="menu-item"><a href="#">Início</a></li>
                        <li class="menu-item"><a href="#">Sobre mim</a></li>
                        <li class="menu-item"><a href="#">Habilidades</a></li>
                        <li class="menu-item"><a href="#">Projetos</a></li>
                        <li class="menu-item"><a href="#">Contato</a></li>
                    </ul>
                </div>
            </div>

        </nav>
    </header>



    <!-- Cards de Projetos -->
    <!-- wrapper com skeletons -->
    <div class="skeleton-card-wrapper dom-visible">
        <div class="skeleton-card-container">

        </div>
    </div>

    <!-- wrapper principal -->
    <div class="project-card-wrapper dom-no-visible">
        <div class="project-card-container">
            <!-- os cards serao injetados aqui pelo js -->
        </div>
    </div>



    <script src="script.js"></script>
</body>
</html>
